    <script>
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (err) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.includes('fetch') && e.message.includes('getter')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
